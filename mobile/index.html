<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声読み上げミニアプリ</title>
    <!-- 👇　iPhoneのホーム画面用アイコンとアプリ化の設定　👇 -->
     <link rel="apple-touch-icon" href="icon.jpg">
     <meta name="apple-mobile-web-app-capable" content="yes">
     <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
     <meta name="apple-mobile-web-app-title" content="音声アプリ">
     <!-- 👆　ここまで　👆 -->

    <!-- 👇ここから追加します-->
     <style>
        /* 全体の背景と文字色 */
        :root {
            --background-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #0000d6;
            --slider-bg: linear-gradient(to right, #2b00ff, #ff0000);
            --badge-bg: #4a54ee;
            --badge-red: #e60000;
        }
 
        /* ダークモード時の色設定 */
        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #000000;
            --text-color: #ffffff;
            --border-color: #2b00ff;
        }

        /* 画面全体を中央寄せにする */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Segoe UI Emoji", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* アプリの外枠カード */
        .container {
            position:relative;
          background-color: var(--card-bg);
          border: 3px solid #000;
          border-radius: 12px;
          padding: 24px;
          width: 600px;
          max-width: 90%;
          box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
          position: relative;
        }

        /* タイトルのスタイル */
        h1 {
            color: #ff0000;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-top: 25px;
        }

        /* ダークモードボタン */
        #darkToggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #000;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        body.dark-mode #darkToggle {
            background: #fff;
            color: #000;
        }
        /* ダークモード時の読み上げ表示エリアの文字色調整 */
        body.dark-mode #textInput,
        body.dark-mode #highlightArea {
            color: #333333 !important; /* 背景が白～薄い色でもはっきり見える暗い文字色 */
        }

        
        body.dark-mode textarea#textInput::placeholder {
            color: #888888 !important;
        }

        /* ダークモード時の文字数・予想時間表示欄の文字色を明るくする */
        body.dark-mode #timeEstimate {
            color: #cccccc !important; /* 明るいグレー（または #ffffff で純白）にする */
        }
        
        /* テキスト入力エリア */
        textarea{
            width: 100%;
            height: 150px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            resize: none;
            margin-bottom: 20px;
        }

       /* 現在読み上げ中の文章スタイル */
       .highlight-text {
       background-color: #ffeb3b; /* 鮮やかな黄色 */
       color: #000;
       font-weight: bold;
       padding: 2px 4px;
       border-radius: 4px;
       }

        /* ボタンを横並びにするエリア */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        /* 緑色の「しゃべる」「だまる」「クリア」ボタン */
        .btn-group button {
            flex: 1;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #004d1a;
            background-color: #00ff66;
        }

        /* label-badge がボタンになっても見た目を維持する設定 */
        button.label-badge {
           border: none;
           cursor: pointer;
        }

        /* スライダーの行スタイル */
        .control-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        /* スライダーの左右の四角いラベル */
        .label-badge {
            width: 60px;
            padding: 6px;
            text-align: center;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            font-size: 14px;
        }

        .badge-blue { background-color: var(--badge-bg);}
        .badge-red { background-color: var(--badge-red);}

        .slider-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
        }

        /* 赤青グラデーションのバー */
        input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 12px;
      border-radius: 6px;
      background: var(--slider-bg);
      outline: none;
    }
        /* スライダーのつまみ（緑の丸） */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #00ff66;
            cursor: pointer;
            border: 2px solid #fff;
        }
 </style>
</head>
<body>
<!-- ここから画面に表示されるパーツ -->
 <div class="container">
    <button id="darkToggle">ダークモード<br>OFF</button>

    <h1>★音声読み上げミニアプリ★</h1>

    <!-- テキスト入力欄 -->
    <textarea id="textInput" placeholder="ここに読み上げた文章を入力してください..."></textarea>

    <!-- 🔥　ここを追加！　読み上げハイライト表示エリア -->
     <div id="highlightArea" style="margin-top: 10px; padding: 12px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; line-height: 1.6; min-height: 50px; text-align: left;">
        ここに読み上げ中のハイライトが表示されます
     </div>
    
    <!-- 💡　ここを追加！　時間と文字数の表示欄 -->
     <div id="timeEstimate" style="margin: 10px 0; font-size: 0.95rem; color: #666;">
        文字数: <span id="charCount">0</span> 文字 ／ 予想時間: 約 <span id="speakingTime">0</span> 秒
     </div>

    <!-- 操作ボタン -->
    <div class="btn-group">
        <button id="speakBtn">しゃべる</button>
        <button id="pauseBtn">一時だまる</button>
        <button id="stopBtn">だまる</button>
        <button id="clearBtn">クリア</button>
    </div>

    <!-- 設定スライダー -->
     <div class="control-row">
        <div class="label-badge badge-blue">０</div>
        <div class="slider-wrapper">
            <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
        </div>
        <div class="label-badge badge-red">１００</div>
     </div>

     <!-- 音声選択ドロップダウン -->
      <div style="margin: 10px 0;">
        <label for="voiceInput" style="font-weight: bold;">声の種類：</label>
        <select id="voiceInput" style="padding: 5px; font-size: 16px; width: 100%; max-width: 300px;"></select>
      </div>
      

      <!-- ↓ ここから追加 ↓ -->
      <div class="control-row" style="margin: 15px 0; gap: 8px; justify-content: center;">
      <button id="btnFav1">★ お気に入り1 を再生</button>
      <button id="btnSaveFav1" style="background-color: #ff9800; color: white;">💾 1に保存</button>
      <span style="margin: 0 4px;">|</span>
      <button id="btnFav2">★ お気に入り2 を再生</button>
      <button id="btnSaveFav2" style="background-color: #ff9800; color: white;">💾 2に保存</button>

      </div>
      
       <div class="control-row">
         <div class="label-badge badge-blue">棒読</div>
         <div class="slider-wrapper">
            <input type="range" id="inflection" min="0" max="2" step="0.1" value="1">
        </div>
        <div class="label-badge badge-red">感情</div>
     </div>

     <div class="control-row">
        <div class="label-badge badge-blue">低音</div>
        <div class="slider-wrapper">
            <input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="1">
        </div>
        <div class="label-badge badge-red">高音</div>
     </div>

     <div class="control-row">
        <div class="label-badge badge-blue">遅い</div>
        <div class="slider-wrapper">
            <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
        </div>
        <div class="label-badge badge-red">早い</div>
     </div>
 </div>

 <script>
    const synth = window.speechSynthesis;
    let voices = [];

    // エレメント取得
    const textInput = document.getElementById('textInput');
    const speakBtn = document.getElementById('speakBtn');
    const stopBtn = document.getElementById('stopBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const clearBtn = document.getElementById('clearBtn');
    const volumeInput = document.getElementById('volume');
    const pitchInput = document.getElementById('pitch');
    const rateInput = document.getElementById('rate');
    const voiceInput = document.getElementById('voiceInput');
    const darkToggle = document.getElementById('darkToggle');

    // 💡 ここに追加！
    const charCount = document.getElementById('charCount');
    const speakingTime = document.getElementById('speakingTime');

    // 文字数と予想時間を更新する関数
    function updateEstimate() {
        const text = textInput.value;
        const length = text.length; // 文字数

        // 速度スライダーの値を取得（標準は 1）
        const rate = parseFloat(rateInput.value) || 1;

        // 一般的な読み上げ速度（1秒あたり約6文字）÷ 速度倍率
        const baseSpeed = 6;
        const totalSeconds = Math.ceil(length / (baseSpeed * rate));

        // 画面に反映
        charCount.textContent = length;
        speakingTime.textContent = totalSeconds;
    }

    // 入力したとき＆速度を変えたときに自動計算するイベントを設定
    textInput.addEventListener('input', updateEstimate);
    rateInput.addEventListener('input', updateEstimate);

    // 音声の一覧取得（ios対応版）
    function loadVoices() {
        const voiceSelect = document.getElementById('voiceSelect') || document.getElementById('voiceInput');
        if (!voiceSelect) return;

        // システムの全音声を取得
        const allVoices = window.speechSynthesis.getVoices();

        // グローバルの voices 配列を更新（日本語音声を抽出）
        voices = allVoices.filter(v => v.lang.includes('ja') || v.lang.includes('JA'));
    
        // もし日本語判定で取れなかった場合は全体を表示対象にする
        if (voices.length === 0) {
            voices = allVoices;
        }

        // 現在選ばれている値を保持
        const selectedVal = voiceSelect.value;

        voiceSelect.innerHTML = '';

        voices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.textContent = voice.name;
            option.value = index; // 選んだときに順番（数字）でわかるようにする
            voiceSelect.appendChild(option);
        });

        if (selectedVal) {
            voiceSelect.value = selectedVal;            
        }
    }


    loadVoices();

    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    
    // IOS Safari対策：タイミングをずらして再読み込み（0.5秒後、1秒後）
    setTimeout(loadVoices, 500);
    setTimeout(loadVoices, 1000);

    // iOS対策：ドロップダウンを触った瞬間＆画面タップ時にも声を再取得する
    const voiceElem = document.getElementById('voiceSelect') || document.getElementById('voiceInput');
    if (voiceElem) {
        voiceElem.addEventListener('focus', loadVoices);
        voiceElem.addEventListener('touchstart', loadVoices);
    }
    window.addEventListener('touchstart', loadVoices, { once: true });
      
    // しゃべる処理を関数化
    function playText() {
        if (synth.speaking) synth.cancel();

        const text = textInput.value;
        const higthlightArea = document.getElementById('highlightArea');

        if (text !== '') {
            // 「。！？\n」の直後で分割する（正規表現の肯定後比: (?<=[。！？\n]) を使用）
            const combinedSentences = text.split(/(?<=[。！？\n])/).filter(s => s.trim() !== '');
            

            // 最初は全文章を通常表示
            higthlightArea.innerHTML = combinedSentences.map((s, idx) => `<span id="sentence-${idx}">${s}</span>`).join('');

            combinedSentences.forEach((sentence, index) => {
                if (sentence.trim() === '') return;
                // 語尾に「。」を補う（少しだけ間をあけるため）
                const utterThis = new SpeechSynthesisUtterance(sentence);
                utterThis.volume = volumeInput.value;
                utterThis.pitch = pitchInput.value;
                utterThis.rate = rateInput.value;

                if (voices.length > 0) {
                    const voiceIndex = parseInt(voiceInput.value, 10) || 0;
                    if (voices[voiceIndex]) {
                        utterThis.voice = voices[voiceIndex];
                    }
                }

            // 🔥 再生開始（start）イベント：喋り始めた文をハイライト！
            utterThis.onstart = () => {
                // すべてのハイライトを一度削除
                combinedSentences.forEach((_, idx) => {
                  const el = document.getElementById(`sentence-${idx}`);
                  if (el) el.classList.remove('highlight-text');
                });

                // 今喋っている文だけハイライトをつける
                const currentEl = document.getElementById(`sentence-${index}`);
                if (currentEl) currentEl.classList.add(`highlight-text`);
            };

            // 🔥 再生終了/キャンセル時：ハイライトを消す
            utterThis.onend = () => {
                const currentEl = document.getElementById(`sentence-${index}`);
                if (currentEl) currentEl.classList.remove(`highlight-text`);
            };

                            
            // キュー（順番待ち）に追加して順次喋らせる
            synth.speak(utterThis);

            }); 
          }  
        }
    

    // しゃべるボタン
    speakBtn.addEventListener('click', playText);

    // 一時だまる / 再開の切り替え処理
    pauseBtn.addEventListener('click', () => {
        // 現在選ばれている声の名前を取得
        const voiceIndex = parseInt(voiceInput.value, 10);
        const selectedVoiceName = voices[voiceIndex] ? voices[voiceIndex].name : '';
        const isGoogleVoice = selectedVoiceName.includes('Google');

        // ボタンの文字が「再開」かどうかで判定する（Google音声は状態取得がバグりやすいため）
        const isResuming = (pauseBtn.textContent === '再開');

        if (isResuming) {
            // --- 【再開するとき】 ---
            if (isGoogleVoice) {
                // Google音声はリセットして最初から読み直す
                synth.cancel();
                setTimeout(() => {
                    playText();
                }, 250);
            } else {
                // 通常音声はそのまま再開
                synth.resume();
            }
            pauseBtn.textContent = '一時だまる';
        } else {
            // --- 【一時停止するとき】 ---
            if (!synth.speaking) return; // そもそも喋っていなければ何もしない
            
            synth.pause(); // 一時停止
            pauseBtn.textContent = '再開';
        }
    });

    // 「だまる」や「クリア」を押したときはボタン表示を「一時だまる」に戻しておく
    stopBtn.addEventListener('click', () => {
        synth.cancel();
        pauseBtn.textContent = '一時だまる';
    });

    // だまる（停止）
    stopBtn.addEventListener('click', () => {
        synth.cancel();
    });

    // クリア
    clearBtn.addEventListener('click', () => {
        textInput.value = '';
        synth.cancel();
    });

    // 3. 「1に保存」ボタンを押したとき
    const btnSaveFav1 = document.getElementById('btnSaveFav1');
    if (btnSaveFav1) {
        btnSaveFav1.addEventListener('click', () => {
            const textInput = document.getElementById('textInput');
            const favData = {
                text: textInput ? textInput.value : '',
                voiceIndex: voiceInput ? voiceInput.selectedIndex : 0,
                pitch: pitchInput ? pitchInput.value : 1,
                rate: rateInput ? rateInput.value : 1,
                volume: volumeInput ? volumeInput.value : 1,
                inflection: document.getElementById('inflection') ? document.getElementById('inflection').value : 1
            };
        
        localStorage.setItem('myVoicePreset1', JSON.stringify(favData));
        alert('「お気に入り1」に現在の設定とテキストを保存しました。！');
        });
    }

    // 4. 「2に保存」ボタンを押したとき
    const btnSaveFav2 = document.getElementById('btnSaveFav2');
    if (btnSaveFav2) {
        btnSaveFav2.addEventListener('click', () => {
           const textInput = document.getElementById('textInput');
           const favData = {
            text: textInput ? textInput.value : '',
            voiceIndex: voiceInput ? voiceInput.selectedIndex : 0,
            pitch: pitchInput ? pitchInput.value : 1,
            rate: rateInput ? rateInput.value : 1,
            volume: volumeInput ? volumeInput.value : 1,
            inflection: document.getElementById('inflection') ? document.getElementById('inflection').value : 1
           };
        
        localStorage.setItem('myVoicePreset2', JSON.stringify(favData));
        alert('「お気に入り2」に現在の設定とテキストを保存しました！');
      });
    }

    // 1. 「お気に入り1 を再生」ボタンを押したとき
    const btnFav1 = document.getElementById('btnFav1');
    if (btnFav1) {
        btnFav1.addEventListener('click', () => {
            const savedData = JSON.parse(localStorage.getItem('myVoicePreset1'));
            if (!savedData) {
                alert('「お気に入り1」のデータが保存されていません。');
                return;
            }
            const favData = JSON.parse(savedData);

            // 保存したデータを画面にセットする
            if (textInput && favData.text) textInput.value = favData.text;
            if (voiceInput && favData.voiceIndex !== undefined) voiceInput.selectedIndex = favData.voiceIndex;
            if (pitchInput && favData.pitch) { pitchInput.value = favData.pitch; pitchInput.dispatchEvent(new Event('input')); }
            if (rateInput && favData.rate) { rateInput.value = favData.rate; rateInput.dispatchEvent(new Event('input')); }
            if (volumeInput && favData.volume) { volumeInput.value = favData.volume; volumeInput.dispatchEvent(new Event('input')); }
            
            // セットが終わったら再生スタート！
            playText();
        });
    }

    // 2. 「お気に入り2 を再生」ボタンを押したとき
    const btnFav2 = document.getElementById('btnFav2');
    if (btnFav2) {
        btnFav2.addEventListener('click', () => {
            const savedData = localStorage.getItem('myVoicePrestet2');
            if (!savedData) {
                alert('「お気に入り2」はまだ保存されていません。');
                return;
            }
            const favData = JSON.parse(savedData);

            if (textInput && favData.text) textInput.value = favData.text;
            if (voiceInput && favData.voiceIndex !== undefined) voiceInput.selectedIndex = favData.voiceIndex;
            if (pitchInput && favData.pitch) { pitchInput.value = favData.pitch; pitchInput.dispatchEvent(new Event('input')); }
            if (rateInput && favData.rate) { rateInput.value = favData.rate; rateInput.dispatchEvent(new Event('input')); }
            if (volumeInput && favData.volume) { volumeInput.value = favData.volume; volumeInput.dispatchEvent(new Event('input')); }
            
            playText();

        });
    }

    // ダークモード切り替え
    darkToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        darkToggle.innerHTML = isDark ? 'ダークモード<br>ON' : 'ダークモード<br>OFF';
    });
</script>
</body>
</html>
